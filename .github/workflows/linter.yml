name: Linters

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linter:
    name: 'Frappe Linter'
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          cache: pip
      - uses: pre-commit/action@v3.0.0

      - name: Download Semgrep rules
        run: git clone --depth 1 https://github.com/frappe/semgrep-rules.git frappe-semgrep-rules

      - name: Run Semgrep rules
        run: |
          pip install semgrep
          semgrep ci --config ./frappe-semgrep-rules/rules --config r/python.lang.correctness

# There is no dependency-audit job on purpose.
#
# This app declares no runtime dependencies -- frappe is installed and
# pinned by bench, which is why `pip-audit .` resolved zero packages and
# reported "No known vulnerabilities found" on every run it would ever
# make. Pointing it at a built bench's environment instead is meaningful
# but not actionable here: that audit reports 163 advisories across 15
# packages (pillow, pypdf, pyjwt, gitpython, cryptography, urllib3 and
# friends), every one of them a frappe pin that this repo cannot raise
# without upgrading frappe. A gate that is red on day one and can only be
# fixed upstream gets switched off or ignored, and an ignore list of 163
# IDs would hide the next one rather than surface it.
#
# Auditing frappe's dependencies is frappe's job. If this app ever takes
# on a dependency of its own, put `pip-audit --desc on .` back: at that
# point it has something to check.
