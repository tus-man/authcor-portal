name: Linters

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linter:
    name: 'Frappe Linter'
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          cache: pip
      - uses: pre-commit/action@v3.0.0

      - name: Download Semgrep rules
        run: git clone --depth 1 https://github.com/frappe/semgrep-rules.git frappe-semgrep-rules

      - name: Run Semgrep rules
        run: |
          pip install semgrep
          semgrep ci --config ./frappe-semgrep-rules/rules --config r/python.lang.correctness

# The dependency audit lives in .github/workflows/ci.yml, not here, and it
# is advisory.
#
# It has to run against a built bench: this app declares no runtime
# dependencies -- the one line in pyproject.toml is
# `# "frappe~=16.0.0" # Installed and managed by bench.` -- so
# `pip-audit .` resolves zero packages and reports "No known
# vulnerabilities found" whatever the state of the world. The CI job
# already builds a bench, so the audit runs there, over the 129 packages
# that bench actually installed.
#
# It does not fail the build, because every finding belongs to Frappe
# rather than to this repo: at the time it was wired up, the bench
# environment carried 163 advisories across 15 packages (pillow, pypdf,
# pyjwt, gitpython, cryptography, sqlparse, weasyprint, urllib3, bleach,
# certifi, brotli, filelock, oauthlib, pdfkit, werkzeug), none of them
# raisable without upgrading Frappe. A gate that is red from its first run
# and only fixable upstream gets switched off; a report that is read gets
# acted on.
#
# Where it gets acted on: before the VPS deploy, Frappe is updated to the
# latest v16 patch release and the audit is re-run. Most of these clear on
# that update. Whatever is still outstanding afterwards is a deliberate
# decision -- accepted, mitigated, or a reason to hold the deploy -- taken
# with the list in hand, not waved through by a workflow.
#
# If this app ever takes on a dependency of its own, `pip-audit .` becomes
# meaningful here too and is worth adding back as a blocking check: that
# one the repo can actually fix.
